name: Deploy D'Griffe

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-dgriffe
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  sync-supabase:
    needs: test
    runs-on: ubuntu-latest
    # Sem continue-on-error: se o RLS canônico falhar, o deploy para. É melhor
    # bloquear do que publicar o backend com o banco em estado permissivo.
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar schema no Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN não definido — o RLS canônico não pode ser aplicado. Deploy bloqueado por segurança."
            exit 1
          fi
          # Extrai o project ref da URL (ex: https://xxxx.supabase.co -> xxxx)
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's|https?://([^.]+)\..*|\1|')
          echo "Project ref: $PROJECT_REF"
          SQL=$(cat supabase/schema-segredos.sql)
          RESP=$(curl -fsSL -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$SQL" '{query:$q}')")
          echo "Resposta Supabase (segredos): $RESP"
          SQL2=$(cat supabase/schema-fidelidade.sql)
          RESP2=$(curl -fsSL -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$SQL2" '{query:$q}')")
          echo "Resposta Supabase (fidelidade/DDL): $RESP2"
          # IMPORTANTE: schema-fidelidade.sql cria policies antigas com USING (true).
          # A migração canônica roda DEPOIS e remove todas elas, deixando o RLS
          # apenas com as policies de dono. Sem este passo, cada push reabriria
          # os dados de todos os clientes para qualquer usuário autenticado.
          SQL3=$(cat supabase/migrations/20261021_rls_canonical.sql)
          RESP3=$(curl -fsSL -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$SQL3" '{query:$q}')")
          echo "Resposta Supabase (RLS canônico): $RESP3"

  # Observação: o projeto CF Pages está conectado ao GitHub (source: github).
  # O Cloudflare faz o deploy automático (build + functions + _routes.json) via webhook
  # a cada push em main. Não é necessário (e é conflitante) fazer upload por API aqui.
  # O _routes.json é copiado para public/ -> dist/ no build, então o Cloudflare o aplica.
  # Mantemos o test+build para validação de CI.

  # O site (dgriffe-site) é um projeto Cloudflare Pages separado e não está
  # conectado ao GitHub como o app. Sem este job, o push atualiza o código mas
  # a produção continua servindo o bundle antigo. O upload usa a API oficial
  # com o token do repositório; nenhum segredo é impresso no log.
  deploy-site:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dgriffe-site/package-lock.json
      - name: Instalar dependências do site
        run: npm ci
        working-directory: dgriffe-site
      - name: Build do site
        run: npm run build
        working-directory: dgriffe-site
        env:
          VITE_API_URL: https://appdgriffedois.onrender.com
      - name: Incluir rotas do Cloudflare Pages
        run: cp _routes.json dist/_routes.json
        working-directory: dgriffe-site
      - name: Publicar site no Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a4d6e3cfe8dde83c8cda8c79ad77202a
        run: node scripts/deploy-cf.mjs dgriffe-site/dist dgriffe-site

  deploy-backend:
    needs: [test, sync-supabase]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK não definido — o Render já faz auto-deploy do GitHub. Pulando."
            exit 0
          fi
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
