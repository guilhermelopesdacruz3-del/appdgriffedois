<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acessar a D'Griffe</title>
  <meta name="robots" content="noindex" />
  <style>
    body {
      font-family: -apple-system, Inter, Segoe UI, Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background:
        radial-gradient(circle at 15% 25%, rgba(212,168,83,0.10), transparent 22%),
        radial-gradient(circle at 85% 75%, rgba(212,168,83,0.10), transparent 22%),
        linear-gradient(180deg, #030303 0%, #050505 60%, #070707 100%);
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      max-width: 420px;
      width: calc(100% - 28px);
      margin: 0 auto;
      text-align: center;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 28px 22px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.55);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
    }
    .logo { width: 56px; height: 56px; border-radius: 9999px; border: 1.5px solid rgba(255,255,255,0.08); box-shadow: 0 8px 30px rgba(0,0,0,0.45); }
    h1 { margin-top: 18px; font-size: 22px; letter-spacing: 0.2em; }
    p { margin-top: 10px; color: #a1a1aa; font-size: 14px; line-height: 1.6; }
    .cta {
      display: inline-block;
      margin-top: 24px;
      padding: 14px 18px;
      border-radius: 9999px;
      border: none;
      background: #D4A853;
      color: #0A0A0A;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-decoration: none;
      box-shadow: 0 12px 40px rgba(212,168,83,0.25);
    }
    .note { margin-top: 14px; color: #a1a1aa; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/icon-512.png" alt="D'Griffe" />
    <h1>D'GRIFFE</h1>
    <p>Abrindo a experiência D'Griffe.</p>
    <a class="cta" href="/">ABRIR APP</a>
    <p class="note">Se não abrir automaticamente, toque no botão acima.</p>
  </div>
  <script>
    (function(){
      try {
        if (window.parent !== window) {
          setTimeout(function() {
            window.parent.postMessage({ type: 'TWA_FALLBACK', url: '/' }, '*');
          }, 800);
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
</body>
</html>
