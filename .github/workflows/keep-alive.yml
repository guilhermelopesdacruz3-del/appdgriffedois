name: Keep-alive backend Render

on:
  schedule:
    # A cada 5 minutos (o plano free do Render "dorme" após ~15 min sem tráfego).
    # O primeiro acesso depois de dormir pode estourar o timeout do proxy
    # (Pages Function de 55s) e gerar 502 no admin.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping no /health do Render
        run: |
          curl -fsS -o /dev/null -w "health_status=%{http_code} tempo=%{time_total}s\n" \
            --max-time 60 "https://appdgriffedois.onrender.com/health" || exit 0