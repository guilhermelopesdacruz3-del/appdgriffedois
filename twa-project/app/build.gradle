plugins {
    id 'com.android.application' version '8.5.0'
}

android {
    namespace 'com.dgriffe.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.dgriffe.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file("dgriffe-release.keystore")
            storePassword "dgriffe2026"
            keyAlias "dgriffe"
            keyPassword "dgriffe2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.core:core:1.13.1'
}
